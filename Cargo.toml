[workspace]
resolver = "3"
members = ["crates/wsm-core", "crates/wsm-cli", "crates/wsmd", "crates/wsm-builder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
wsm-core = { path = "crates/wsm-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
